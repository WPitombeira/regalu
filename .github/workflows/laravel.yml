        run: |
          set -euo pipefail

          "$RUNNER_TEMP/regalu-browser-venv/bin/python" -B tests/Browser/event_budget_smoke.py --output coverage/event-budget-browser
          "$RUNNER_TEMP/regalu-browser-venv/bin/python" -B tests/Browser/event_budget_report_test.py --output coverage/event-budget-browser

      - name: Upload event budget browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: event-budget-browser
          path: |
            coverage/event-budget-browser/report.json
            coverage/event-budget-browser/**/*.png
          if-no-files-found: error

      - name: Exercise localized footer navigation
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/regalu-browser-cache
        run: |
          set -euo pipefail

          "$RUNNER_TEMP/regalu-browser-venv/bin/python" -B tests/Browser/footer_navigation_smoke.py --output coverage/footer-browser
          "$RUNNER_TEMP/regalu-browser-venv/bin/python" -B tests/Browser/footer_navigation_report_test.py coverage/footer-browser/report.json

      - name: Upload footer browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
